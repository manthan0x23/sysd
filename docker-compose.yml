# Local Postgres for development. Start with:  npm run db:up
# The password lives in .env.local (POSTGRES_PASSWORD); it is never committed.
services:
  db:
    image: postgres:17-alpine
    container_name: sysd-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: sysd
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.local}
      POSTGRES_DB: sysd
    ports:
      - "127.0.0.1:5432:5432"   # reachable from this machine only
    volumes:
      - sysd-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sysd -d sysd"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  sysd-pgdata:
